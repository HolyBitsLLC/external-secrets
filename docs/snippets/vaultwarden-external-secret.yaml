apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-example
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vaultwarden
    kind: SecretStore
  target:
    name: vaultwarden-example
  data:
    - secretKey: password
      remoteRef:
        key: example-login
        property: password
    - secretKey: api-token
      remoteRef:
        key: example-login
        property: api-token
