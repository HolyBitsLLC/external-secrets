apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vaultwarden-push-example
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: vaultwarden
      kind: SecretStore
  selector:
    secret:
      name: app-credentials
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: app-credentials
