apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vaultwarden
spec:
  provider:
    vaultwarden:
      url: https://vault.example.com
      cache:
        ttl: 60s
        maxSize: 100
      auth:
        secretRef:
          clientID:
            name: vaultwarden-credentials
            key: clientID
          clientSecret:
            name: vaultwarden-credentials
            key: clientSecret
          masterPassword:
            name: vaultwarden-credentials
            key: masterPassword
