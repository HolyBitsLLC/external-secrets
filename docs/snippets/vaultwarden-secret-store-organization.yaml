apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vaultwarden-org
spec:
  provider:
    vaultwarden:
      url: https://vault.example.com
      organizationName: platform
      auth:
        secretRef:
          clientID:
            name: vaultwarden-credentials
            key: clientID
          clientSecret:
            name: vaultwarden-credentials
            key: clientSecret
          masterPassword:
            name: vaultwarden-credentials
            key: masterPassword
