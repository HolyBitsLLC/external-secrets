suite: test SecretStore
template: tests/crds/secretstore.yml
tests:
  - it: matches SecretStore correctly
    asserts:
      - matchSnapshot:
          path: tests/__snapshot__
          # We deliberately want to test all the included elements.
          ignoreErrors:
            - "in body should have at most 1 properties"
            # The sample generator hardcodes the literal "string" for every
            # string format except date-time/byte, so cty writes
            # `organizationId: string` for the `format: uuid` field and then its
            # own schema validator rejects the placeholder it just generated.
            # The format constraint is intended, so ignore only that
            # self-inflicted error instead of dropping it from the CRD.
            - "spec.provider.vaultwarden.organizationId in body must be of type uuid"
