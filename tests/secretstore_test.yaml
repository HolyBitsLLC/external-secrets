suite: test SecretStore
template: tests/crds/secretstore.yml
tests:
  - it: matches SecretStore correctly
    asserts:
      - matchSnapshot:
          path: tests/__snapshot__
          # We deliberately want to test all the included elements.
          ignoreErrors:
            - "in body should have at most 1 properties"
            # The sample generator emits the literal "string" for every string
            # format except date-time/byte, so it writes
            # `organizationId: string` for the `format: uuid` field and then
            # rejects the placeholder it just generated. The format is intended
            # validation, so ignore only this self-inflicted error.
            - "spec.provider.vaultwarden.organizationId in body must be of type uuid"
