name: Build and Publish Harbor Image

# Builds the forked external-secrets image (webhook + vaultwarden providers)
# and publishes it to harbor.dittmanfamily.com/holybitsllc/external-secrets.
#
# push to main:  kaniko build → push sha-<commit> + main tags.
#
# The GitOps image-bump PR is intentionally NOT automated here yet (it needs
# the APP_ID/APP_PRIVATE_KEY GitHub App secrets in this repo); the pin is
# updated manually in harvester-argo for now.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and Push Container Image
    uses: HolyBitsLLC/harvester-argo/.github/workflows/reusable-kaniko-build.yaml@main
    with:
      image: harbor.dittmanfamily.com/holybitsllc/external-secrets
      dockerfile: Dockerfile.harbor
      job-prefix: external-secrets
      tags: 'sha-${{ github.sha }},main'
      snapshot-mode: "time"
